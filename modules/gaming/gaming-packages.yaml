# Gaming packages and tools
# Everything needed for gaming on Linux

description: Gaming packages and tools for Linux gaming

packages:
  - steam # Steam gaming platform
  - name: com.heroicgameslauncher.hgl # Heroic Games launcher
    type: flatpak
  - name: com.hypixel.HytaleLauncher
    type: flatpak
  # - name: org.prismlauncher.PrismLauncher
  #   type: flatpak
  # - name: org.vinegarhq.Sober
  #   type: flatpak
  - gamescope-git # Gaming compositor
  - mangohud # Performance overlay
  - gamemode # Optimize system for gaming
  - name: com.vysp3r.ProtonPlus # Proton version manager
    type: flatpak

  - spicetify-cli
  - spicetify-themes-git
  - spotify-launcher

conflicts: []
post_install_hook: scripts/setup-hyprscope.sh
