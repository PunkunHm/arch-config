# Hyprland Wayland compositor
# Dynamic tiling Wayland compositor with smooth animations
# XXX Uses DankMaterialShell (DMS) for bar, notifications, launcher, and lock screen

description: Hyprland Wayland compositor

packages:
  - hyprland # Main compositor
  - hypridle
  - hyprlock
  - hyprsunset
  - uwsm
  - xdg-desktop-portal-hyprland # Desktop portal
  # Clipboard utilities
  - wl-clipboard # Wayland clipboard utilities
  - cliphist # Clipboard history manager
  - grim # Screenshot tool
  - slurp # Region selector
  - hyprshot # Temporary solution
  - hyprdynamicmonitors-bin # Display configuration
  - brightnessctl # Brightness control
  - pavucontrol # Audio control
  - udiskie # Auto mount drives
  - xorg-xrdb
  - pacman-contrib

# Conflicts with other window managers
conflicts: []
