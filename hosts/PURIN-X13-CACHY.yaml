host: PURIN-X13-CACHY
description: CachyOS-KDE testing/ Isolate from hyprland + quickshell project
import: []
enabled_modules:
  - base
  - _kde-dots
  - drivers/asus
  - general/basic-packages
  - general/music
  - gaming/gaming-packages
  - gaming/optimization-packages
  - declared-packages
packages:
exclude: []
additional_packages: []
flatpak_scope: system
auto_prune: true
module_processing: parallel
strict_package_order: true
config_backups:
  enabled: true
  max_backups: 5
system_backups:
  enabled: false
  backup_on_sync: false
  backup_on_update: false
  tool: null
  snapper_config: root
  max_backups: 5
services:
  enabled:
    - NetworkManager
    - NetworkManager-dispatcher
    - NetworkManager-wait-online
    - avahi-daemon
    - bluetooth
    - getty@
    - limine-snapper-sync
    - nvidia-hibernate
    - nvidia-resume
    - nvidia-suspend
    - ufw
  disabled:
    - ananicy-cpp
    - nvidia-powerd
enabled_service_profiles: []
update_hooks:
  pre_update: null
  post_update: null
  behavior: ask
  devel: false
default_apps:
  scope: system
  browser: zen
  text_editor: dev.zed.Zed
  file_manager: org.kde.dolphin
  terminal: kitty
  video_player: org.kde.haruna
  audio_player: mpv
  image_viewer: org.kde.gwenview
  pdf_viewer: zen
  mime_types: {}
editor: nano
aur_helper: yay
