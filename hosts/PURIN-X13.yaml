host: PURIN-X13
description: Personal Laptop
import: []
enabled_modules:
  - _undersea-dots
  - asus/asus
  - win-programs/digital-art
  - gaming
  - gaming/controller-support
  - package-mods/main-apps
  - package-mods/content-creation
packages: []
exclude: []
additional_packages: []
flatpak_scope: user
auto_prune: false
module_processing: parallel
strict_package_order: false
config_backups:
  enabled: true
  max_backups: 5
system_backups:
  enabled: true
  backup_on_sync: true
  backup_on_update: true
  tool: null
  snapper_config: root
  max_backups: 5
services:
  enabled:
    - NetworkManager
    - NetworkManager-dispatcher
    - ananicy
    - avahi-daemon
    - bluetooth
    - containerd
    - docker
    - earlyoom
    - firewalld
    - getty@
    - greetd
    - iwd
    - nvidia-powerd
    - nvidia-resume
    - nvidia-suspend
    - plugin_loader
    - power-profiles-daemon
    - supergfxd
    - tailscaled
    - upower
  disabled: []
enabled_service_profiles: []
update_hooks:
  pre_update: null
  post_update: null
  behavior: ask
default_apps:
  scope: system
  browser: zen
  text_editor: dev.zed.Zed
  file_manager: nemo
  terminal: null
  video_player: null
  audio_player: com.github.marinm.songrec
  image_viewer: null
  pdf_viewer: xreader
  mime_types: {}
editor: nano
aur_helper: yay
